<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-lg border-0 rounded-4" style="max-width: 420px; width: 100%">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <!-- <div
          class="bg-primary bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
          style="width: 70px; height: 70px"
        >
          <i class="bi bi-person-lock fs-2 text-primary"></i>
        </div> -->

        <h2 class="fw-bold">Welcome Back</h2>
        <p class="text-muted mb-0">Silakan login untuk melanjutkan</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-floating mb-3">
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="name@example.com"
            formControlName="email"
          />

          <label for="email">Email Address</label>
        </div>

        <div class="form-floating mb-3">
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Password"
            formControlName="password"
          />

          <label for="password">Password</label>
        </div>

        <!-- <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember" />

            <label class="form-check-label" for="remember"> Remember me </label>
          </div>

          <a href="#" class="text-decoration-none"> Forgot Password? </a>
        </div> -->

        <button
          type="submit"
          class="btn btn-primary w-100 py-2 rounded-3 fw-semibold"
          [disabled]="loginForm.invalid"
        >
          Login
        </button>
      </form>
    </div>
  </div>
</div>
