<!-- Basic Bootstrap Table -->
<div class="card">
  <h5 class="card-header">Table Deals</h5>

  <div class="table-responsive text-nowrap">
    <table class="table">
      <thead>
        <tr>
          <th>No</th>
          <th>ID</th>
          <th>Lead ID</th>
          <th>Title</th>
          <th>Value</th>
          <th>Stage</th>
          <th>Closed At</th>
          <th>Created At</th>
        </tr>
      </thead>
      <tbody class="table-border-bottom-0">
        <tr *ngFor="let deal of deals; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ deal.id }}</td>
          <td>{{ deal.lead_id }}</td>
          <td>{{ deal.title }}</td>
          <td>{{ deal.value }}</td>
          <td>{{ deal.stage }}</td>
          <td>{{ deal.closed_at }}</td>
          <td>{{ deal.created_at }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<!--/ Basic Bootstrap Table -->
