<div *ngIf="view === 'list'">
  <!-- Basic Bootstrap Table -->
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Table Customers</h5>
      <button class="btn btn-primary btn-sm" (click)="showCreate()">Tambah Customer</button>
    </div>

    <div class="table-responsive text-nowrap">
      <table class="table">
        <thead>
          <tr>
            <th>No</th>
            <th>name</th>
            <th>email</th>
            <th>phone</th>
            <th>company</th>
            <th>status</th>
          </tr>
        </thead>
        <tbody class="table-border-bottom-0">
          <tr *ngFor="let c of customers; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ c.name }}</td>
            <td>{{ c.email }}</td>
            <td>{{ c.phone }}</td>
            <td>{{ c.company }}</td>
            <td>{{ c.status }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <!--/ Basic Bootstrap Table -->
</div>

<div *ngIf="view === 'create'">
  <div class="container-fluid px-4">
    <div class="d-flex align-items-center my-4 gap-3">
      <button class="btn btn-outline-secondary btn-sm" (click)="backToList()">Kembali</button>
      <h1 class="mb-0 fs-4 fw-bold">Tambah Customer</h1>
    </div>

    <div class="card mb-4">
      <div class="card-body p-4">
        <div *ngIf="errorMsg" class="alert alert-danger">{{ errorMsg }}</div>

        <form [formGroup]="createForm" (ngSubmit)="submitCreate()">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Nama <span class="text-danger">*</span></label>
              <input
                type="text"
                class="form-control"
                formControlName="name"
                placeholder="Nama customer"
              />
              <div
                *ngIf="createForm.get('name')?.invalid && createForm.get('name')?.touched"
                class="text-danger small mt-1"
              >
                Nama wajib diisi
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                formControlName="email"
                placeholder="email@contoh.com"
              />
            </div>

            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input
                type="text"
                class="form-control"
                formControlName="phone"
                placeholder="08xxxxxxxxxx"
              />
            </div>

            <div class="col-md-6">
              <label class="form-label">Perusahaan</label>
              <input
                type="text"
                class="form-control"
                formControlName="company"
                placeholder="Nama perusahaan"
              />
            </div>

            <div class="col-md-6">
              <label class="form-label">Status</label>
              <select class="form-select" formControlName="status">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button
              type="submit"
              class="btn btn-primary"
              [disabled]="createForm.invalid || isSaving"
            >
              {{ isSaving ? 'Menyimpan...' : 'Simpan' }}
            </button>
            <button type="button" class="btn btn-outline-secondary" (click)="backToList()">
              Batal
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
